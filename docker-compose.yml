version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: accountant-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: accountant_os
      POSTGRES_PASSWORD: accountant_os
      POSTGRES_DB: accountant_os
    ports:
      - "5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accountant_os"]
      interval: 5s
      timeout: 5s
      retries: 10
